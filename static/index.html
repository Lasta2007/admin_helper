<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Helper</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet" />
<link href="https://cdn.datatables.net/searchbuilder/1.6.0/css/searchBuilder.dataTables.min.css" rel="stylesheet" />
<link href="https://cdn.datatables.net/datetime/1.5.2/css/dataTables.dateTime.min.css" rel="stylesheet" />
</head>
<body>
<div class="sidebar">
  <div class="logo">Admin Helper</div>
  <div class="nav-item" id="ipamNav">IPAM</div>
  <div class="nav-item" id="workPcNav">WORK PC</div>
  <div class="nav-item" id="settingsNav">Настройки</div>
</div>

<div class="main">
  <div id="netView">
    <div class="header">
      <h2>Подсети</h2>
      <div class="toolbar">
        <button id="addBtn">Добавить</button>
      </div>
    </div>
    <table class="grid">
      <thead><tr><th>Подсеть</th><th>Описание</th><th>Действия</th></tr></thead>
      <tbody id="networks"></tbody>
    </table>
  </div>

  <div id="hostView" class="hidden">
    <div class="header">
      <a id="backBtn" class="back" href="#">&larr; Назад</a>
      <h2 id="networkTitle">Подсеть</h2>
      <div class="toolbar">
        <span id="pingStatus" class="ping-status"></span>
        <input type="text" id="globalSearch" class="search-input" placeholder="Поиск по всем полям...">
        <select id="hostFilter" class="filter-select">
          <option value="all">Все хосты</option>
          <option value="online">Доступны</option>
          <option value="offline">Не доступны</option>
        </select>
      </div>
    </div>
    <table class="grid">
      <thead><tr><th>Status</th><th>IP</th><th>Ping</th><th>Hostname</th><th>Порты</th><th>MAC</th><th>Комментарий</th></tr></thead>
      <tbody id="hosts"></tbody>
    </table>
  </div>

  <div id="workPcView" class="hidden">
    <div class="header">
      <a id="workPcBackBtn" class="back" href="#">&larr; Назад к IPAM</a>
      <h2>Рабочие компьютеры</h2>
      <div class="toolbar">
        <button id="refreshWorkPcBtn">Обновить</button>
      </div>
    </div>
    <table id="workPcTable" class="display">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="settingsView" class="hidden">
    <div class="header">
      <a id="settingsBackBtn" class="back" href="#">&larr; Назад к IPAM</a>
      <h2>Настройки</h2>
    </div>
    <div class="settings-form">
      <h3>IPAM настройки</h3>
      <label>Интервал проверки (минуты)</label>
      <input id="pingIntervalInput" type="number" min="1" step="1">
      <label>Таймаут ping (секунды)</label>
      <input id="pingTimeoutInput" type="number" min="1" step="1">
      <label><input type="checkbox" id="portScanEnabledCheckbox"> Сканирование портов</label>
      <label>Интервал сканирования портов (минуты)</label>
      <input id="portScanIntervalInput" type="number" min="60" step="60">
      
      <h3>WORK PC настройки</h3>
      <label>Путь к файлу log.txt</label>
      <div style="display: flex; gap: 10px;">
        <input id="workPcLogPathInput" type="text" style="flex: 1;">
        <button id="saveWorkPcLogPathBtn">Установить</button>
      </div>
      <label>Период обновления данных (минуты)</label>
      <input id="workPcUpdateIntervalInput" type="number" min="1" step="1">
      <button id="saveWorkPcSettingsBtn">Сохранить настройки WORK PC</button>
      
      <button id="saveSettingsBtn" style="margin-top: 20px;">Сохранить настройки IPAM</button>
    </div>
  </div>
</div>

<div id="networkModal" class="modal hidden">
 <div class="modal-content">
  <h3 id="modalTitle">Подсеть</h3>
  <label>Подсеть (CIDR)</label>
  <input id="cidrInput" type="text">
  <label>Описание</label>
  <input id="descInput" type="text">
  <div class="modal-buttons">
   <button id="saveNetworkBtn">Сохранить</button>
   <button id="cancelNetworkBtn">Отмена</button>
  </div>
 </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/searchbuilder/1.6.0/js/dataTables.searchBuilder.min.js"></script>
<script src="https://cdn.datatables.net/datetime/1.5.2/js/dataTables.dateTime.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
